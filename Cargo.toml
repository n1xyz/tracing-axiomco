[package]
name = "tracing-axiom-n1" 
version = "0.1.0"
edition = "2024"

[lib]
name = "tracing_axiom"

[features]
default = ["rustls-tls-webpki-roots"]
# Requires a serde-enabled tracing patch; see the README.
serde = []
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
native-tls-alpn = ["reqwest/native-tls-alpn"]
rustls-tls = ["reqwest/rustls-tls"]
rustls-tls-manual-roots = ["reqwest/rustls-tls-manual-roots"]
rustls-tls-webpki-roots = ["reqwest/rustls-tls-webpki-roots"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]
system-proxy = ["reqwest/system-proxy"]

[dependencies]
bytes = "1.11.1"
prost = "0.14.4"
quanta = "0.12.0"
rand = { version = "0.9.1", default-features = false, features = ["std", "alloc", "os_rng", "small_rng"] }
reqwest = { version = "0.12.19", default-features = false, features = ["http2", "rustls-tls-webpki-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "^0.3.17", features = ["formatting", "serde"] }
tokio = { version = "1.45.1", features = ["macros", "sync"] }
tracing = "0.1.41"
tracing-core = "0.1.34"
tracing-subscriber = "0.3.19"
zstd = "0.13.2"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
axum = { version = "0.8.4", features = ["macros"] }
clap = { version = "4.5.38", features = ["derive"] }
criterion = "0.6.0"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
tracing-mock = { version = "0.1.0-beta.1", features = ["tracing-subscriber"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
